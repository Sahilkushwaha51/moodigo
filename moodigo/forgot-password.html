<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodigo | Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#11161d;
    --surface:#1a222c;
    --border:#2c3844;
    --text:#f2eee6;
    --gold:#e2a63f;
    --green:#5fa8a0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    overflow-x:hidden;
}

/* HEADER — matches the Moodigo login page */
.moodigo-header{
    height:88px;
    background:rgba(17,22,29,.94);
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    padding:0 6%;
    position:relative;
    z-index:10;
    backdrop-filter:blur(16px);
    box-shadow:0 5px 25px rgba(0,0,0,.20);
}
.moodigo-logo{
    display:flex;
    align-items:center;
    gap:11px;
    text-decoration:none;
}
.moodigo-logo img{
    width:62px;
    height:70px;
    object-fit:contain;
    border-radius:10px;
    display:block;
}
.moodigo-name{
    font-size:27px;
    font-weight:600;
    letter-spacing:-.5px;
    background:linear-gradient(90deg,#e2a63f,#5fa8a0 35%,#c46a68 68%,#9081c9);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}
.moodigo-nav{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
}
.moodigo-nav a{
    position:relative;
    padding:12px 18px;
    color:#aeb7c1;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    border-radius:10px;
    transition:.3s ease;
}
.moodigo-nav a:hover{
    color:#fff;
    background:rgba(255,255,255,.06);
}
.moodigo-nav a::after{
    content:"";
    position:absolute;
    width:0;
    height:2px;
    left:50%;
    bottom:5px;
    transform:translateX(-50%);
    border-radius:5px;
    background:linear-gradient(90deg,#e2a63f,#5fa8a0,#c46a68,#9081c9);
    transition:.3s ease;
}
.moodigo-nav a:hover::after{width:45%}

/* PAGE */
.forgot-page{
    min-height:calc(100vh - 88px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:55px 20px 70px;
    position:relative;
    overflow:hidden;
}
.circle{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}
.circle.one{
    width:280px;height:280px;left:-140px;top:80px;
    background:rgba(226,166,63,.09);
}
.circle.two{
    width:320px;height:320px;right:-160px;bottom:-70px;
    background:rgba(95,168,160,.09);
}
.circle.three{
    width:140px;height:140px;right:17%;top:8%;
    background:rgba(144,129,201,.06);
}

/* CARD */
.forgot-wrapper{
    width:100%;
    max-width:520px;
    position:relative;
    z-index:2;
}
.forgot-card{
    background:linear-gradient(145deg,rgba(33,43,55,.98),rgba(26,34,44,.98));
    border:1px solid var(--border);
    border-radius:22px;
    padding:48px 46px 42px;
    box-shadow:0 25px 60px rgba(0,0,0,.28);
    position:relative;
    overflow:hidden;
}
.forgot-card::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:100%;height:3px;
    background:linear-gradient(90deg,#e2a63f,#5fa8a0,#c46a68,#9081c9);
}
.forgot-heading{
    text-align:center;
    margin-bottom:30px;
}
.small-title{
    color:#d9a83b;
    font-size:12px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:9px;
}
.forgot-heading h1{
    font-family:'Fraunces',serif;
    font-size:38px;
    font-weight:500;
    color:#fff;
    line-height:1.2;
    margin-bottom:10px;
}
.forgot-heading p{
    color:#c8ced5;
    font-size:14px;
    line-height:1.6;
}
.form-group{margin-bottom:18px}
.form-group label{
    display:block;
    color:#e7eaf0;
    font-size:13px;
    font-weight:500;
    margin-bottom:8px;
}
.input-wrap input{
    width:100%;
    height:49px;
    padding:0 15px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    background:#151d26;
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    transition:.3s ease;
}
.input-wrap input::placeholder{color:#727d89}
.input-wrap input:focus{
    border-color:#5fa8a0;
    box-shadow:0 0 0 3px rgba(95,168,160,.08);
}
.reset-button{
    width:100%;
    height:49px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    color:#11161d;
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    font-weight:600;
    background:linear-gradient(90deg,#e2a63f,#5fa8a0,#c46a68,#9081c9);
    transition:.25s ease;
    margin-top:4px;
}
.reset-button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(95,168,160,.18);
}
.back-login{
    display:block;
    text-align:center;
    margin-top:21px;
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
}
.back-login:hover{color:#d9a83b}

.try-another{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#8e99a5;
}

.try-another button{
    margin-left:5px;
    border:0;
    background:none;
    color:#d9a83b;
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    padding:0;
}

.try-another button:hover{
    color:#fff;
    text-decoration:underline;
}

.phone-recovery{
    display:none;
    margin-top:4px;
}

.recovery-divider{
    display:flex;
    align-items:center;
    gap:12px;
    color:#697582;
    font-size:10px;
    letter-spacing:1.5px;
    margin:22px 0 18px;
}

.recovery-divider::before,
.recovery-divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border);
}

.recovery-divider span{
    flex-shrink:0;
}

.forgot-note{
    text-align:center;
    margin-top:18px;
    color:#727d89;
    font-size:11px;
}
.forgot-note span{color:#d9a83b}

@media(max-width:700px){
    .moodigo-header{padding:0 20px}
    .moodigo-nav a{padding:10px;font-size:13px}
    .forgot-page{padding:40px 18px 55px}
}
@media(max-width:560px){
    .moodigo-header{height:76px}
    .moodigo-logo img{width:50px;height:55px}
    .moodigo-name{font-size:22px}
    .moodigo-nav{gap:2px}
    .moodigo-nav a{padding:8px 7px;font-size:11px}
    .forgot-card{padding:36px 25px 32px}
    .forgot-heading h1{font-size:32px}
}
@media(max-width:430px){
    .moodigo-name{display:none}
    .moodigo-logo img{width:48px;height:52px}
    .moodigo-nav a{padding:8px 5px;font-size:10px}
}
</style>
</head>

<body>
<header class="moodigo-header">
    <a href="index.html" class="moodigo-logo">
        <img src="logo.png" alt="Moodigo Logo">
        <span class="moodigo-name">Moodigo</span>
    </a>
    <nav class="moodigo-nav">
        <a href="website.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="about.html">About</a>
    </nav>
</header>

<main class="forgot-page">
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <div class="forgot-wrapper">
        <div class="forgot-card">
            <div class="forgot-heading">
                <div class="small-title">Reset Your Password</div>
                <h1>Forgot your password?</h1>
                <p>Enter your registered email address and we'll help you get back into your Moodigo account.</p>
            </div>

            <form id="forgotForm">
                <div class="form-group" id="emailGroup">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <button type="submit" class="reset-button" id="emailButton">Send Reset Link →</button>

                <div class="try-another">
                    <span>Can't access your email?</span>
                    <button type="button" id="tryAnotherBtn">Try another way</button>
                </div>

                <div class="phone-recovery" id="phoneRecovery">
                    <div class="recovery-divider"><span>OR</span></div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-wrap">
                            <input type="tel" id="phone" placeholder="Enter your phone number" inputmode="tel">
                        </div>
                    </div>

                    <button type="button" class="reset-button" id="phoneButton">Send OTP →</button>
                </div>
            </form>

            <a href="login.html" class="back-login">← Back to Login</a>
        </div>

        <div class="forgot-note">
            Your mood. Your people. <span>Your journey.</span>
        </div>
    </div>
</main>

<script>
const forgotForm = document.getElementById("forgotForm");
const tryAnotherBtn = document.getElementById("tryAnotherBtn");
const phoneRecovery = document.getElementById("phoneRecovery");
const phoneInput = document.getElementById("phone");

forgotForm.addEventListener("submit", function(event){
    event.preventDefault();
    alert("Password reset link has been sent to your email.");
});

tryAnotherBtn.addEventListener("click", function(){
    phoneRecovery.style.display = "block";
    tryAnotherBtn.parentElement.style.display = "none";
    phoneInput.focus();
});

document.getElementById("phoneButton").addEventListener("click", function(){
    if(!phoneInput.value.trim()){
        phoneInput.focus();
        return;
    }
    alert("An OTP has been sent to your phone number.");
});
</script>
</body>
</html>
