<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodigo | Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#11161d;--surface:#1a222c;--border:#2c3844;--gold:#e2a63f;--green:#5fa8a0;--red:#c46a68;--purple:#9081c9}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:#f2eee6;font-family:'Space Grotesk',sans-serif;overflow-x:hidden}
.moodigo-header{height:88px;background:rgba(17,22,29,.94);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 6%;position:relative;z-index:10;backdrop-filter:blur(16px);box-shadow:0 5px 25px rgba(0,0,0,.2)}
.moodigo-logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.moodigo-logo img{width:62px;height:70px;object-fit:contain;border-radius:10px;display:block}
.moodigo-name{font-size:27px;font-weight:600;letter-spacing:-.5px;background:linear-gradient(90deg,#e2a63f,#5fa8a0 35%,#c46a68 68%,#9081c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.moodigo-nav{margin-left:auto;display:flex;align-items:center;gap:8px}
.moodigo-nav a{position:relative;padding:12px 18px;color:#aeb7c1;text-decoration:none;font-size:14px;font-weight:500;border-radius:10px;transition:.3s}
.moodigo-nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.moodigo-nav a::after{content:"";position:absolute;width:0;height:2px;left:50%;bottom:5px;transform:translateX(-50%);border-radius:5px;background:linear-gradient(90deg,#e2a63f,#5fa8a0,#c46a68,#9081c9);transition:.3s}
.moodigo-nav a:hover::after{width:45%}
.signup-page{min-height:calc(100vh - 88px);display:flex;justify-content:center;align-items:center;padding:55px 20px 70px;position:relative;overflow:hidden}
.circle{position:absolute;border-radius:50%;pointer-events:none}
.circle.one{width:280px;height:280px;left:-140px;top:80px;background:rgba(226,166,63,.09)}
.circle.two{width:320px;height:320px;right:-160px;bottom:-70px;background:rgba(95,168,160,.09)}
.circle.three{width:140px;height:140px;right:17%;top:8%;background:rgba(144,129,201,.06)}
.signup-wrapper{width:100%;max-width:470px;position:relative;z-index:2}
.signup-card{background:linear-gradient(145deg,rgba(33,43,55,.98),rgba(26,34,44,.98));border:1px solid var(--border);border-radius:22px;padding:38px 38px 34px;box-shadow:0 25px 60px rgba(0,0,0,.28);position:relative;overflow:hidden}
.signup-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,#e2a63f,#5fa8a0,#c46a68,#9081c9)}
.signup-heading{text-align:center;margin-bottom:28px}
.small-title{color:#d9a83b;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px}
.signup-heading h1{font-family:'Fraunces',serif;font-size:36px;font-weight:500;color:#fff;line-height:1.2;margin-bottom:9px}
.signup-heading p{color:#c8ced5;font-size:14px;line-height:1.55}
.form-group{margin-bottom:17px}
.form-group label{display:block;color:#e7eaf0;font-size:13px;font-weight:500;margin-bottom:8px}
.input-wrap input{width:100%;height:48px;padding:0 15px;border:1px solid var(--border);border-radius:10px;outline:none;background:#151d26;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:14px;transition:.3s}
.input-wrap input::placeholder{color:#727d89}
.input-wrap input:focus{border-color:#5fa8a0;box-shadow:0 0 0 3px rgba(95,168,160,.08)}
.password-row{display:flex;gap:10px}.password-row .form-group{flex:1}
.terms{display:flex;align-items:flex-start;gap:9px;margin:3px 0 20px;color:#9da7b2;font-size:12px;line-height:1.5}
.terms input{margin-top:3px;accent-color:#5fa8a0}.terms a{color:#d9a83b;text-decoration:none}
.signup-button{width:100%;height:49px;border:0;border-radius:10px;cursor:pointer;color:#11161d;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;background:linear-gradient(90deg,#e2a63f,#5fa8a0,#c46a68,#9081c9);transition:.25s}
.signup-button:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(95,168,160,.18)}
.login-text{text-align:center;color:#9da7b2;font-size:13px;margin-top:20px}.login-text a{color:#fff;text-decoration:none;font-weight:600}
.signup-note{text-align:center;margin-top:18px;color:#727d89;font-size:11px}.signup-note span{color:#d9a83b}
@media(max-width:700px){.moodigo-header{padding:0 20px}.moodigo-nav a{padding:10px;font-size:13px}.signup-page{padding:40px 18px 55px}}
@media(max-width:560px){.moodigo-header{height:76px}.moodigo-logo img{width:50px;height:55px}.moodigo-name{font-size:22px}.moodigo-nav{gap:2px}.moodigo-nav a{padding:8px 7px;font-size:11px}.signup-card{padding:32px 23px 28px}.signup-heading h1{font-size:31px}}
@media(max-width:430px){.moodigo-name{display:none}.moodigo-logo img{width:48px;height:52px}.moodigo-nav a{padding:8px 5px;font-size:10px}.password-row{flex-direction:column;gap:0}}
</style>
</head>
<body>
<header class="moodigo-header">
<a href="index.html" class="moodigo-logo">
<img src="logo.png" alt="Moodigo Logo">
<span class="moodigo-name">Moodigo</span>
</a>
<nav class="moodigo-nav">
<a href="website.html">Home</a>
<a href="explore.html">Explore</a>
<a href="how-it-works.html">How It Works</a>
<a href="about.html">About</a>
</nav>
</header>

<main class="signup-page">
<div class="circle one"></div><div class="circle two"></div><div class="circle three"></div>
<div class="signup-wrapper">
<div class="signup-card">
<div class="signup-heading">
<div class="small-title">Start Your Journey</div>
<h1>Create your Moodigo account.</h1>
<p>Join Moodigo and let your mood guide your next adventure.</p>
</div>

<form id="signupForm">
<div class="form-group">
<label for="name">Full Name</label>
<div class="input-wrap"><input type="text" id="name" placeholder="Enter your name" required></div>
</div>
<div class="form-group">
<label for="email">Email Address</label>
<div class="input-wrap"><input type="email" id="email" placeholder="Enter your email" required></div>
</div>
<div class="password-row">
<div class="form-group"><label for="password">Password</label><div class="input-wrap"><input type="password" id="password" placeholder="Create password" minlength="6" required></div></div>
<div class="form-group"><label for="confirmPassword">Confirm Password</label><div class="input-wrap"><input type="password" id="confirmPassword" placeholder="Confirm password" minlength="6" required></div></div>
</div>
<div class="terms">
<input type="checkbox" id="terms" required>
<label for="terms">I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>.</label>
</div>
<button type="submit" class="signup-button">Create Account →</button>
</form>

<div class="login-text">Already have an account? <a href="login.html">Log in</a></div>
</div>
<div class="signup-note">Your mood. Your people. <span>Your journey.</span></div>
</div>
</main>

<script>
document.getElementById("signupForm").addEventListener("submit",function(e){
e.preventDefault();
const p=document.getElementById("password").value;
const c=document.getElementById("confirmPassword").value;
if(p!==c){alert("Passwords do not match.");return;}
alert("Account created successfully!");
});
</script>
</body>
</html>
